<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/global.css">
    <link rel="stylesheet" href="css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">

    <title>Libre Berry Crush Eau De Parfum</title>
    <link rel="icon" type="image/png" href="img/favicon.png">

</head>
<body>
    <main>
        <div class="box-container">
        <article>
            <figure>
                <img src="img/perfume-card.svg" alt="The picture shows a perfume bottle filled with a dark pink liquid, with a black cap and golden ornaments. It is surrounded by a few raspberries and a dark pink popsicle. All is laid down in a light pink background." class="perfume-img">
            </figure>        
        <section class="perfume-info">
                <h2 class="perfume-subtitle">PERFUME</h2>
                <h1 class="perfume-title">Libre Berry Crush <br> Eau De Parfum with Raspberry
                </h1>
                <p class="perfume-description">A fruitier reinterpretation of LIBRE’s iconic floral lavender scent, infused with the juiciness of raspberries.</p>
        </section> 
                <section class="price-box">
                    <span class="price">$150.00</span>
                    <del class="price-discount">$185.00</del>
                </section>
                <section class="button">
                <button class="add-to-cart-btn">
                <img src="img/shopping-cart.svg" alt="The picture shows a shopping cart icon." class="cart-icon">       
                Add to Cart             
                </button>
                </section>
        </article>
        </div>
    </main>    
    <footer class="footer">
        <p>Developed by Debora Zanatta | <a href="https://www.linkedin.com/in/debora-03-zanatta/" target="_blank">LinkedIn</a> | <a href="https://github.com/dehzanatta03" target="_blank">GitHub</a></p>
    </footer>

</body>
</html>
